name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Cache ExecuTorch
        id: cache-executorch
        uses: actions/cache@v4
        with:
          path: |
            Vendor/ExecuTorch
            .executorch_build
          key: executorch-v0.6.0-macos-${{ runner.arch }}

      - name: Setup Python
        if: steps.cache-executorch.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        if: steps.cache-executorch.outputs.cache-hit != 'true'
        run: |
          brew install zstd libomp

      - name: Install buck2
        if: steps.cache-executorch.outputs.cache-hit != 'true'
        run: |
          curl -sLO "https://ossci-macos.s3.amazonaws.com/buck2-aarch64-apple-darwin-2024-05-15.zst"
          zstd -d buck2-aarch64-apple-darwin-2024-05-15.zst -o buck2
          chmod +x buck2
          sudo mv buck2 /usr/local/bin/
          buck2 --version

      - name: Install Python dependencies
        if: steps.cache-executorch.outputs.cache-hit != 'true'
        run: |
          pip install zstd pyyaml cmake
          pip install torch==2.7.0

      - name: Build ExecuTorch xcframeworks
        if: steps.cache-executorch.outputs.cache-hit != 'true'
        run: |
          chmod +x build_executorch.sh
          ./build_executorch.sh

      - name: Build app bundle
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify app bundle
        run: |
          ls -la PixAI.app
          test -d PixAI.app

      - name: Package
        run: |
          zip -r PixAI.zip PixAI.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: PixAI.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}