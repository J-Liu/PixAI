name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify app bundle
        run: |
          ls -la PixAI.app
          test -d PixAI.app

      - name: Package
        run: |
          zip -r PixAI.zip PixAI.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: PixAI.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
