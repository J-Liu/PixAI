<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 山景天空 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <!-- 远山 -->
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <!-- 近山 -->
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#431407"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <!-- 照片边框 -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>

    <!-- 照片裁剪：圆角矩形，后续山景都裁在这里面 -->
    <clipPath id="photoClip">
      <rect x="252" y="252" width="520" height="520" rx="72"/>
    </clipPath>
  </defs>

  <!-- ============ 照片本体 ============ -->
  <g transform="rotate(-6 512 512)">
    <!-- 外框（米白，给照片一点实体厚度） -->
    <rect x="232" y="232" width="560" height="560" rx="88" fill="url(#frame)"/>
    <!-- 内部照片区域 -->
    <rect x="252" y="252" width="520" height="520" rx="72" fill="#F97316"/>

    <!-- 山景（裁剪在照片内） -->
    <g clip-path="url(#photoClip)">
      <!-- 天空 -->
      <rect x="252" y="252" width="520" height="520" fill="url(#sky)"/>

      <!-- 太阳 -->
      <circle cx="620" cy="400" r="72" fill="#FFF7ED"/>

      <!-- 远山 -->
      <path d="M252 640 L400 500 L520 610 L640 470 L772 640 L772 772 L252 772 Z"
            fill="url(#far)" opacity="0.9"/>

      <!-- 近山 -->
      <path d="M252 720 L360 610 L470 700 L600 580 L772 720 L772 772 L252 772 Z"
            fill="url(#near)"/>
    </g>
  </g>

  <!-- ============ AI 光点 ============ -->
  <g>
    <!-- 主星：四芒星，白心 + 橙色外扩 -->
    <path d="M760 300
             C 772 340, 792 360, 832 372
             C 792 384, 772 404, 760 444
             C 748 404, 728 384, 688 372
             C 728 360, 748 340, 760 300 Z"
          fill="#F97316"/>
    <path d="M760 330
             C 767 352, 780 365, 802 372
             C 780 379, 767 392, 760 414
             C 753 392, 740 379, 718 372
             C 740 365, 753 352, 760 330 Z"
          fill="#FFF7ED"/>

    <!-- 副星点 -->
    <path d="M690 250
             C 695 265, 702 272, 717 277
             C 702 282, 695 289, 690 304
             C 685 289, 678 282, 663 277
             C 678 272, 685 265, 690 250 Z"
          fill="#FDBA74"/>
  </g>
</svg>
